name: KINEIS-1B
norad: 60079
description: >
  KINEIS-1B is part of the Kinéis constellation, designed for global IoT connectivity.
  It transmits telemetry using FSK modulation at 2400 baud.
data:
  - &tlm
    name: telemetry
transmitters:
  FSK2400:
    frequency: 400.657e6
    modulation: FSK
    baudrate: 2400
    data:
      - *tlm