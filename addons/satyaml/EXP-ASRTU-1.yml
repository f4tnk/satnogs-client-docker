name: ASRTU-1
norad: 99130
data:
  &tlm Telemetry:
    telemetry: asrtu
    frames:
      telemetry_frame:
        description: >
          Decodes the telemetry frame for ASRTU-1.
        fields:
          - name: satellite_id
            description: >
              Unique identifier of the satellite.
            type: uint8
            position: 0
          - name: battery_voltage
            description: >
              Battery voltage in volts.
            type: uint16
            position: 1
            scale: 0.01
          - name: temperature
            description: >
              Internal temperature in degrees Celsius.
            type: int8
            position: 3
            scale: 1
          - name: uptime
            description: >
              Time since startup in seconds.
            type: uint32
            position: 4
          - name: error_flags
            description: >
              Error state flags of the satellite.
            type: uint8
            position: 8
transports:
  &tm_kiss TM KISS:
    protocol: TM short KISS
    virtual_channels:
    - 0
    - 2
    data:
    - *tlm
transmitters:
  9k6 BPSK downlink:
    frequency: 436.210e+6
    modulation: BPSK
    baudrate: 9600
    framing: CCSDS Concatenated
    precoding: differential
    RS basis: conventional
    frame size: 223
    syncword: "0x1ACFFC1D"
    transports:
    - *tm_kiss
